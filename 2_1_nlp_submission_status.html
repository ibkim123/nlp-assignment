<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">자연어처리 과제 제출 현황 (1~15주차)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0A0D1C; --bg-1:#111633; --card:#151B3B; --card-border:#2A3266;
    --text-0:#F1F3FC; --text-1:#A8AEDB; --text-2:#6C72A0;
    --holo-a:#5EE7C7; --holo-b:#B48CFF; --holo-c:#FFC96B;
    --ok:#5EE7C7; --err:#FF8A8A; --pending:#5C6294;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, #1B2354 0%, transparent 45%),
      radial-gradient(circle at 90% 10%, #241C4A 0%, transparent 40%),
      var(--bg-0);
    color:var(--text-0); font-family:'Inter',sans-serif;
    padding:48px 20px 80px;
  }
  .wrap{max-width:1200px;margin:0 auto;}
  .top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--holo-a);font-weight:600;}
  .lang-switch{display:flex;gap:4px;background:var(--bg-1);border:1px solid var(--card-border);border-radius:999px;padding:3px;flex-shrink:0;}
  .lang-btn{
    background:none;border:none;color:var(--text-2);font-size:12px;font-weight:600;padding:5px 12px;
    border-radius:999px;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:background .15s,color .15s;
  }
  .lang-btn.active{background:linear-gradient(90deg,var(--holo-a),var(--holo-b));color:#0A0D1C;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(22px,4vw,32px);font-weight:700;margin:0 0 8px;line-height:1.3;}
  .sub{color:var(--text-1);font-size:14px;line-height:1.6;max-width:640px;margin:0 0 24px;}

  .meta-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;}
  .pill{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--bg-1);border:1px solid var(--card-border);
    color:var(--text-1);font-size:13px;padding:8px 14px;border-radius:999px;
    text-decoration:none;transition:border-color .15s;cursor:pointer;
  }
  .pill:hover{border-color:var(--holo-a);color:var(--text-0);}
  .pill svg{width:13px;height:13px;flex-shrink:0;}
  .search-box{
    flex:1;min-width:200px;background:rgba(255,255,255,.03);border:1px solid var(--card-border);
    color:var(--text-0);font-size:13px;padding:9px 12px;border-radius:999px;outline:none;
  }
  .search-box:focus{border-color:var(--holo-a);}
  #result-status{font-size:12px;color:var(--text-2);margin:0 0 24px;}

  /* ── 로그인 패널 ── */
  .login-panel{
    background:var(--card);border:1px solid var(--card-border);border-radius:14px;
    padding:24px;max-width:440px;margin:0 auto;
  }
  .login-tabs{display:flex;gap:8px;margin-bottom:18px;}
  .login-tab{
    flex:1;background:rgba(255,255,255,.02);border:1px solid var(--card-border);color:var(--text-1);
    font-size:13px;font-weight:600;padding:10px;border-radius:8px;cursor:pointer;
    font-family:'Space Grotesk',sans-serif;transition:border-color .15s,color .15s,background .15s;
  }
  .login-tab.active{border-color:var(--holo-a);color:var(--text-0);background:rgba(94,231,199,.08);}
  .login-body .field{margin-bottom:12px;}
  .login-body label{display:block;font-size:12px;color:var(--text-1);margin-bottom:5px;}
  .login-body select, .login-body input{
    width:100%;background:rgba(255,255,255,.03);border:1px solid var(--card-border);
    color:var(--text-0);font-size:14px;padding:10px 12px;border-radius:8px;outline:none;
  }
  .login-body select:focus, .login-body input:focus{border-color:var(--holo-a);}
  .login-body select option{background:#151B3B;color:#F1F3FC;}
  .login-body select option:disabled{color:#6C72A0;}
  .login-btn{
    width:100%;border:none;font-weight:700;font-size:14px;padding:12px;border-radius:8px;cursor:pointer;
    font-family:'Space Grotesk',sans-serif;background:linear-gradient(90deg,var(--holo-a),var(--holo-b));color:#0A0D1C;
  }
  #login-status{font-size:12px;margin-top:10px;min-height:16px;}
  #login-status.err{color:var(--err);}
  #login-status.ok{color:var(--ok);}

  .session-bar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px;
    background:var(--bg-1);border:1px solid var(--card-border);border-radius:999px;padding:8px 8px 8px 16px;
  }
  .session-label{font-size:13px;color:var(--text-1);}
  .session-label b{color:var(--holo-a);}
  .session-bar .pill{margin-left:auto;}

  .content-area{display:none;}

  /* ── 설정 패널 (관리자 전용) ── */
  .settings-panel{
    background:var(--card);border:1px solid var(--card-border);border-radius:14px;
    padding:16px 18px;margin-bottom:24px;
  }
  .settings-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .settings-title{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;}
  .settings-desc{font-size:12px;color:var(--text-2);margin-top:4px;}
  .settings-body{margin-top:14px;}
  .settings-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:14px;
  }
  .settings-cell{
    background:rgba(255,255,255,.02);border:1px solid var(--card-border);border-radius:10px;
    padding:10px;
  }
  .settings-wk{font-size:11px;color:var(--text-1);font-weight:600;margin-bottom:6px;}
  .settings-cell label{
    display:flex;align-items:center;justify-content:space-between;gap:6px;
    font-size:11px;color:var(--text-2);margin-bottom:4px;font-weight:400;
  }
  .settings-cell input[type="number"]{
    width:52px;background:rgba(255,255,255,.04);border:1px solid var(--card-border);
    color:var(--text-0);font-size:12px;padding:4px 6px;border-radius:6px;text-align:center;
  }
  .settings-cell input[type="number"]:focus{border-color:var(--holo-a);outline:none;}
  .save-btn{
    background:linear-gradient(90deg,var(--holo-a),var(--holo-b));color:#0A0D1C;border:none;
    font-weight:700;
  }

  .summary-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:24px;}
  .summary-card{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:14px 16px;}
  .summary-card .val{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:var(--holo-a);}
  .summary-card .lbl{font-size:11px;color:var(--text-2);letter-spacing:.04em;margin-top:2px;}

  .grid{display:flex;flex-direction:column;gap:14px;}
  .card{
    position:relative;background:var(--card);border:1px solid var(--card-border);
    border-radius:14px;padding:18px 18px 14px;overflow:hidden;isolation:isolate;
  }
  .card::before{
    content:"";position:absolute;inset:0;
    background:conic-gradient(from 180deg at 100% 0%, var(--holo-a), var(--holo-b), var(--holo-c), var(--holo-a));
    opacity:.08;z-index:-1;
  }
  .card.own-card{border-color:rgba(94,231,199,.55);}
  .card.own-card::before{opacity:.14;}
  .card-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .sid{font-family:'Space Grotesk',sans-serif;font-size:12px;color:var(--text-2);}
  .sname{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;}
  .own-tag{
    font-size:10px;font-weight:700;color:#0A0D1C;background:var(--holo-a);
    padding:2px 8px;border-radius:999px;letter-spacing:.02em;
  }
  .progress{font-size:12px;color:var(--holo-a);margin-left:auto;}
  .cum-badge{
    font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:700;
    padding:3px 10px;border-radius:999px;border:1px solid var(--card-border);
  }
  .cum-badge.full{color:var(--holo-a);border-color:rgba(94,231,199,.4);background:rgba(94,231,199,.08);}
  .cum-badge.partial{color:var(--holo-c);border-color:rgba(255,201,107,.4);background:rgba(255,201,107,.08);}
  .cum-badge.empty{color:var(--text-2);}

  .week-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px;}
  .week-cell{
    background:rgba(255,255,255,.02);border:1px solid var(--card-border);border-radius:8px;
    padding:8px 6px;text-align:center;cursor:default;transition:border-color .15s,background .15s;
  }
  .week-cell.clickable{cursor:pointer;}
  .week-cell.locked{opacity:.85;}
  .week-cell.full{border-color:rgba(94,231,199,.4);background:rgba(94,231,199,.08);}
  .week-cell.full.clickable:hover{border-color:var(--holo-a);}
  .week-cell.partial{border-color:rgba(255,201,107,.4);background:rgba(255,201,107,.08);}
  .week-cell.partial.clickable:hover{border-color:var(--holo-c);}
  .week-cell.empty{border-color:var(--card-border);}
  .week-cell.unset{border-style:dashed;opacity:.55;}
  .week-cell .wk{font-size:10px;color:var(--text-2);margin-bottom:3px;}
  .week-cell.full .wk{color:var(--holo-a);}
  .week-cell.partial .wk{color:var(--holo-c);}
  .week-cell .pct{font-size:14px;font-weight:700;font-family:'Space Grotesk',sans-serif;color:var(--text-1);}
  .week-cell.full .pct{color:var(--holo-a);}
  .week-cell.partial .pct{color:var(--holo-c);}
  .week-cell .cnt{font-size:9px;color:var(--text-2);margin-top:2px;}
  .week-cell .dot{width:5px;height:5px;border-radius:50%;background:var(--pending);margin:0 auto 4px;}
  .week-cell.full .dot{background:var(--ok);}
  .week-cell.partial .dot{background:var(--holo-c);}
  .lock-icon{font-size:9px;color:var(--text-2);margin-top:2px;}

  .detail-panel{
    margin-top:12px;padding:10px 12px;border-radius:8px;background:rgba(255,255,255,.02);
    border:1px solid var(--card-border);font-size:12px;display:none;
  }
  .detail-panel.open{display:block;}
  .detail-panel .d-title{color:var(--text-1);margin-bottom:6px;font-weight:600;}
  .detail-item{display:flex;align-items:center;gap:8px;padding:4px 0;border-top:1px dashed rgba(255,255,255,.06);}
  .detail-item:first-of-type{border-top:none;}
  .detail-item a{color:var(--holo-a);text-decoration:none;word-break:break-all;}
  .detail-item a:hover{text-decoration:underline;}
  .detail-item .badge{font-size:10px;padding:2px 6px;border-radius:999px;border:1px solid var(--card-border);color:var(--text-2);flex-shrink:0;}
  .detail-item .time{color:var(--text-2);font-size:10px;margin-left:auto;flex-shrink:0;}
  .detail-item .del-btn{
    background:none;border:1px solid rgba(255,138,138,.35);color:var(--err);font-size:10px;
    padding:3px 8px;border-radius:999px;cursor:pointer;flex-shrink:0;font-family:'Inter',sans-serif;
    transition:background .15s,opacity .15s;
  }
  .detail-item .del-btn:hover{background:rgba(255,138,138,.12);}
  .detail-item .del-btn:disabled{opacity:.5;cursor:not-allowed;}

  .empty-state{color:var(--text-2);font-size:13px;padding:30px 0;text-align:center;}
  footer{margin-top:32px;font-size:12px;color:var(--text-2);line-height:1.7;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top-row">
    <div class="eyebrow">Kimpo University · <span id="eyebrow-rest">자연어처리</span></div>
    <div class="lang-switch">
      <button class="lang-btn active" id="lang-en" data-lang="en">English</button>
      <button class="lang-btn" id="lang-ko" data-lang="ko">한국어</button>
    </div>
  </div>
  <h1 id="t-h1">자연어처리 과제 제출 현황 (1~15주차)</h1>
  <p class="sub" id="t-sub"></p>

  <!-- ── 로그인 패널 ── -->
  <div class="login-panel" id="login-panel">
    <div class="login-tabs">
      <button class="login-tab active" id="tab-student" data-role="student"></button>
      <button class="login-tab" id="tab-admin" data-role="admin"></button>
    </div>
    <div class="login-body" id="login-student-body">
      <div class="field">
        <label id="t-loginIdLabel" for="login-studentSelect">학번</label>
        <select id="login-studentSelect"></select>
      </div>
      <div class="field">
        <label id="t-loginPwLabel" for="login-password">비밀번호</label>
        <input type="password" id="login-password" autocomplete="off">
      </div>
      <button class="login-btn" id="login-student-btn"></button>
    </div>
    <div class="login-body" id="login-admin-body" style="display:none;">
      <div class="field">
        <label id="t-loginAdminPwLabel" for="login-admin-password">관리자 비밀번호</label>
        <input type="password" id="login-admin-password" autocomplete="off">
      </div>
      <button class="login-btn" id="login-admin-btn"></button>
    </div>
    <div id="login-status"></div>
  </div>

  <!-- ── 로그인 후 표시되는 영역 ── -->
  <div id="content-area" class="content-area">
    <div class="session-bar" id="session-bar">
      <span class="session-label" id="session-label"></span>
      <button class="pill" id="logout-btn"></button>
    </div>

    <div class="meta-row">
      <button class="pill" id="refresh-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        <span id="t-refreshBtn"></span>
      </button>
      <input class="search-box" id="search">
    </div>
    <div id="result-status"></div>

    <div class="settings-panel" id="settings-panel" style="display:none;">
      <div class="settings-head">
        <div>
          <div class="settings-title" id="t-settingsTitle"></div>
          <div class="settings-desc" id="t-settingsDesc"></div>
        </div>
        <button class="pill" id="toggle-settings"></button>
      </div>
      <div class="settings-body" id="settings-body" style="display:none;">
        <div class="settings-grid" id="settings-grid"></div>
        <button class="pill save-btn" id="save-settings-btn"></button>
        <span id="settings-status" style="font-size:12px;color:var(--text-2);margin-left:10px;"></span>
      </div>
    </div>

    <div class="summary-row" id="summary"></div>

    <div class="grid" id="grid"></div>
  </div>

  <footer id="t-footer"></footer>
</div>

<script>
// 제출 폼(1_1_nlp_submission_form.html)과 동일한 Apps Script 웹 앱 URL을 붙여넣으세요.
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzA1FQIOuFwZICo8YwdIUYbIbf5r9TAtp_zSetgNgXcTbH_1cRJ4hfedGoHSegTrMYxuA/exec";
const TOTAL_WEEKS = 15;
const WEEKS = Array.from({length: TOTAL_WEEKS}, (_, i) => i + 1);

// ══════════ 번역 사전 ══════════
const T = {
  ko: {
    pageTitle: '자연어처리 과제 제출 현황 (1~15주차)',
    eyebrowRest: '자연어처리',
    h1: '자연어처리 과제 제출 현황 (1~15주차)',
    sub: '본인 학번으로 로그인하면 자신의 제출 파일을 확인할 수 있고, 다른 학생은 제출률(%) 통계만 볼 수 있습니다. 관리자로 로그인하면 전체 학생의 파일을 모두 확인하고 주차별 필요 제출 수를 설정할 수 있습니다.',
    tabStudent: '학생으로 보기',
    tabAdmin: '관리자로 보기',

    idPlaceholder: '학번을 선택하세요',
    loginPwLabel: '비밀번호',
    loginPwPlaceholder: '과제 제출 시 사용하는 비밀번호',
    loginBtn: '확인',
    loginAdminPwLabel: '관리자 비밀번호',
    loginAdminPwPlaceholder: '관리자 비밀번호',
    logoutBtn: '로그아웃',
    refreshBtn: '최신 데이터 새로고침',
    searchPlaceholder: '학번 또는 이름으로 검색...',
    loading: '불러오는 중...',
    settingsTitle: '⚙️ 주차별 필요 제출 파일 수 설정 (관리자 전용)',
    settingsDesc: '각 주차마다 HTML 파일과 기타 파일(PPT/Word 등)이 몇 개씩 필요한지 지정하면, 학생별 제출률(%)이 이 기준으로 계산됩니다.',
    settingsOpen: '설정 열기',
    settingsClose: '설정 닫기',
    saveSettingsBtn: '설정 저장',
    settingsSaving: '저장 중...',
    settingsSaved: t => '저장되었습니다 (' + t + ').',
    settingsSaveFail: err => '저장 실패: ' + err,
    settingsSaveError: err => '저장 중 오류: ' + err,
    settingsNeedAdmin: '관리자만 설정을 저장할 수 있습니다.',
    settingsUrlNotSet: 'WEB_APP_URL이 설정되지 않았습니다.',
    weekLabel: n => n + '주차',
    weekTag: n => n + '주차',
    htmlLabel: 'HTML',
    otherLabel: '기타',
    summaryTotal: '제출한 학생 수',
    summaryFullyDone: '15주차 모두 제출',
    summaryAvgWeeks: '1인당 평균 제출 주차',
    summaryAvgCum: '전체 평균 누적 제출률',
    noStudentData: '아직 제출된 데이터가 없습니다.',
    noNameLabel: '(이름 미입력)',
    ownTag: '내 제출',
    cumulativeLabel: n => '누적 ' + n + '%',
    progressLabel: (d, t) => d + ' / ' + t + '주차 제출',
    itemCount: n => n + '건',
    weekDetailTitle: n => n + '주차 제출 내역',
    typeFile: '파일',
    typeLink: '링크',
    urlNotSet: 'WEB_APP_URL이 설정되지 않았습니다.',
    loadingStatus: '구글 시트에서 최신 데이터를 불러오는 중...',
    loadedStatus: t => '구글 시트 데이터로 갱신되었습니다 (' + t + ' 기준).',
    loadFailStatus: err => '데이터를 불러오지 못했습니다: ' + err,
    loadErrorStatus: err => '오류가 발생했습니다: ' + err,
    checking: '확인 중...',
    loginFailed: '로그인에 실패했습니다.',
    errorPrefix: err => '오류: ' + err,
    enterIdErr: '학번을 선택하세요.',
    enterPwErr: '비밀번호를 입력하세요.',
    enterAdminPwErr: '관리자 비밀번호를 입력하세요.',
    sessionAdmin: '🔑 <b>관리자</b> 모드로 로그인됨 (전체 열람 가능)',
    sessionStudent: (name, id) => '👤 <b>' + (name || id) + '</b> (' + id + ') 로 로그인됨 — 본인 파일만 열람 가능',
    footer: '이 페이지는 제출 폼과 동일한 Apps Script 웹 앱에서 데이터를 읽어옵니다. 로그인한 계정에 따라 서버에서 열람 권한을 검증하며, 본인 소유가 아닌 학생의 파일명·링크·URL은 서버에서부터 전송되지 않습니다(관리자 제외).',

function mergeWithRoster(students){

let LANG = 'en';
function t(key){ return T[LANG][key]; }

// Required file counts per week (HTML / other). Default is 0 (unset) until an admin saves settings.
let settingsMap = {};
WEEKS.forEach(w => { settingsMap[w] = { htmlRequired: 0, otherRequired: 0 }; });

function computeWeekStat(items, req){
  const htmlDone = items.filter(it => it.type === '파일' && it.isHtml).length;
  const otherDone = items.filter(it => it.type === '파일' && !it.isHtml).length;
  const linkDone = items.filter(it => it.type === '링크').length;
  const htmlReq = (req && req.htmlRequired) || 0;
  const otherReq = (req && req.otherRequired) || 0;
  const totalReq = htmlReq + otherReq;
  const achieved = Math.min(htmlDone, htmlReq) + Math.min(otherDone, otherReq);
  let percent, status;
  if (totalReq > 0) {
    // 관리자가 지정한 필요 개수를 초과 제출해도 100%를 넘지 않도록 상한을 둡니다.
    percent = Math.min(100, Math.round((achieved / totalReq) * 100));
    status = percent >= 100 ? 'full' : percent > 0 ? 'partial' : 'empty';
  } else {
    const any = htmlDone + otherDone + linkDone > 0;
    percent = any ? 100 : 0;
    status = any ? 'full' : 'unset';
  }
  return { htmlDone, otherDone, linkDone, htmlReq, otherReq, totalReq, achieved, percent, status };
}

function computeCumulative(weeksData){
  let sumAchieved = 0, sumReq = 0, unsetDone = 0, unsetTotal = 0;
  WEEKS.forEach(w => {
    const items = weeksData[String(w)] || [];
    const stat = computeWeekStat(items, settingsMap[w]);
    if (stat.totalReq > 0) {
      sumAchieved += stat.achieved;
      sumReq += stat.totalReq;
    } else {
      unsetTotal += 1;
      if (stat.status === 'full') unsetDone += 1;
    }
  });
  // 누적 비율도 마찬가지로 100%를 상한으로 둡니다.
  if (sumReq > 0) return { percent: Math.min(100, Math.round((sumAchieved / sumReq) * 100)) };
  return { percent: unsetTotal ? Math.min(100, Math.round((unsetDone / unsetTotal) * 100)) : 0 };
}

function typeLabel(type){ return type === '파일' ? t('typeFile') : type === '링크' ? t('typeLink') : type; }

function fmtTime(iso){
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const locale = LANG === 'en' ? 'en-US' : 'ko-KR';
  return d.toLocaleString(locale, { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
}

async function callApi(payload){
  if (WEB_APP_URL.indexOf('http') !== 0) return { ok:false, error: t('urlNotSet') };

    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ lang: LANG }, payload))

}

function renderSummary(students){
  const summary = document.getElementById('summary');
  const total = students.length;
  const doneCounts = students.map(s => WEEKS.filter(w => s.weeks[String(w)] && s.weeks[String(w)].length).length);
  const fullyDone = doneCounts.filter(c => c === TOTAL_WEEKS).length;
  const avg = total ? (doneCounts.reduce((a,b)=>a+b,0) / total).toFixed(1) : '0';
  const cumPercents = students.map(s => computeCumulative(s.weeks).percent);
  const avgCum = total ? Math.round(cumPercents.reduce((a,b)=>a+b,0) / total) : 0;
  summary.innerHTML = `
    <div class="summary-card"><div class="val">${total}</div><div class="lbl">${t('summaryTotal')}</div></div>
    <div class="summary-card"><div class="val">${fullyDone}</div><div class="lbl">${t('summaryFullyDone')}</div></div>
    <div class="summary-card"><div class="val">${avg}</div><div class="lbl">${t('summaryAvgWeeks')}</div></div>
    <div class="summary-card"><div class="val">${avgCum}%</div><div class="lbl">${t('summaryAvgCum')}</div></div>
  `;
}

function renderResults(data){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  if (!data.length) {
    grid.innerHTML = '<div class="empty-state">' + t('noStudentData') + '</div>';
    return;
  }
  data.sort((a,b) => String(a.studentId).localeCompare(String(b.studentId)));

  data.forEach(s => {
    const isOwn = session && session.role === 'student' && s.studentId === session.studentId;
    const canViewDetail = session && (session.role === 'admin' || isOwn);
    const doneCount = WEEKS.filter(w => s.weeks[String(w)] && s.weeks[String(w)].length).length;
    const cum = computeCumulative(s.weeks);
    const cumClass = cum.percent >= 100 ? 'full' : cum.percent > 0 ? 'partial' : 'empty';
    const card = document.createElement('div');
    card.className = 'card' + (isOwn ? ' own-card' : '');

    const weekCells = WEEKS.map(w => {
      const items = s.weeks[String(w)] || [];
      const stat = computeWeekStat(items, settingsMap[w]);
      const clickable = canViewDetail && items.length > 0;
      const cntLabel = stat.totalReq > 0
        ? `${stat.htmlDone}/${stat.htmlReq}${t('htmlLabel')} · ${stat.otherDone}/${stat.otherReq}${t('otherLabel')}`
        : (items.length ? t('itemCount')(items.length) : '-');
      const lockNote = (!canViewDetail && items.length > 0) ? '<div class="lock-icon">🔒</div>' : '';
      return `<div class="week-cell ${stat.status}${clickable ? ' clickable' : ''}${!canViewDetail ? ' locked' : ''}" data-sid="${s.studentId}" data-week="${w}">
        <div class="dot"></div>
        <div class="wk">${t('weekTag')(w)}</div>
        <div class="pct">${stat.status === 'unset' && !items.length ? '-' : stat.percent + '%'}</div>
        <div class="cnt">${cntLabel}</div>
        ${lockNote}
      </div>`;
    }).join('');

    card.innerHTML = `
      <div class="card-head">
        <span class="sname">${s.name || t('noNameLabel')}</span>
        <span class="sid">${s.studentId}</span>
        ${isOwn ? '<span class="own-tag">' + t('ownTag') + '</span>' : ''}
        <span class="cum-badge ${cumClass}">${t('cumulativeLabel')(cum.percent)}</span>
        <span class="progress">${t('progressLabel')(doneCount, TOTAL_WEEKS)}</span>
      </div>
      <div class="week-grid">${weekCells}</div>
      <div class="detail-panel" id="detail-${s.studentId}"></div>
    `;
    grid.appendChild(card);

    if (canViewDetail) {
      card.querySelectorAll('.week-cell.clickable').forEach(cell => {
        cell.addEventListener('click', () => {
          const week = cell.dataset.week;
          const items = s.weeks[week] || [];
          const panel = card.querySelector('.detail-panel');
          const isSameWeek = panel.dataset.week === week && panel.classList.contains('open');
          if (isSameWeek) { panel.classList.remove('open'); return; }
          panel.dataset.week = week;
          panel.innerHTML = `<div class="d-title">${t('weekDetailTitle')(week)}</div>` + items.map((it, idx) => `
            <div class="detail-item">
              <span class="badge">${typeLabel(it.type)}</span>
              <a href="${it.url}" target="_blank" rel="noopener">${it.name}</a>
              <span class="time">${fmtTime(it.time)}</span>
              <button type="button" class="del-btn" data-idx="${idx}">${t('deleteBtn')}</button>
            </div>
          `).join('');
          panel.classList.add('open');
          panel.querySelectorAll('.del-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              const it = items[Number(btn.dataset.idx)];
              deleteItem(s.studentId, week, it, btn);
            });
          });
        });
      });
    }
  });

  if (session) updateSessionLabel_();
}

async function deleteItem(studentId, week, item, btnEl){
  if (!confirm(t('deleteConfirm'))) return;
  btnEl.disabled = true;
  const prevLabel = btnEl.textContent;
  btnEl.textContent = t('deleting');
  const payload = session.role === 'admin'
    ? { action: 'delete', role: 'admin', adminPassword: session.adminPassword, studentId, week, type: item.type, url: item.url }
    : { action: 'delete', role: 'student', studentId: session.studentId, password: session.password, week, type: item.type, url: item.url };
  try {
    const result = await callApi(payload);
    if (result.ok) {
      refresh();
    } else {
      alert(t('deleteFail')(result.error || t('unknownError')));
      btnEl.disabled = false;
      btnEl.textContent = prevLabel;
    }
  } catch (e) {
    alert(t('deleteError')(e.message));
    btnEl.disabled = false;
    btnEl.textContent = prevLabel;
  }
}

}

      rows.forEach(r => { settingsMap[r.week] = { htmlRequired: r.htmlRequired, otherRequired: r.otherRequired }; });
      settingsStatus.textContent = t('settingsSaved')(new Date().toLocaleTimeString(LANG === 'en' ? 'en-US' : 'ko-KR'));
      renderSummary(currentData);
      filterAndRender(gridData);
    } else {
      settingsStatus.textContent = t('settingsSaveFail')(result.error || t('unknownError'));
    }
  } catch (e) {
    settingsStatus.textContent = t('settingsSaveError')(e.message);
  }
});

/* ══════════ 새로고침 ══════════ */
async function refresh(){
  if (!session) return;
  const status = document.getElementById('result-status');
  status.textContent = t('loadingStatus');
  try {
    const payload = session.role === 'admin'
      ? { action: 'status', role: 'admin', adminPassword: session.adminPassword }
      : { action: 'status', role: 'student', studentId: session.studentId, password: session.password };
    const result = await callApi(payload);
    if (result.ok && result.students) {
      if (result.settings) {
        result.settings.forEach(r => {
          settingsMap[r.week] = { htmlRequired: r.htmlRequired || 0, otherRequired: r.otherRequired || 0 };
        });
        renderSettingsUI();
      }
      currentData = mergeWithRoster(result.students);
      gridData = computeGridData();
      renderSummary(currentData);
      filterAndRender(gridData);
      status.textContent = t('loadedStatus')(new Date().toLocaleTimeString(LANG === 'en' ? 'en-US' : 'ko-KR'));
    } else {
      status.textContent = t('loadFailStatus')(result.error || t('unknownError'));
    }
  } catch (e) {
    status.textContent = t('loadErrorStatus')(e.message);
  }
}

document.getElementById('refresh-btn').addEventListener('click', refresh);

// ══════════ 초기화 ══════════
document.getElementById('result-status').textContent = T.en.loading;
applyLanguage();
</script>
</body>
</html>
