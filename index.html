<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">자연어처리 과제 제출 (1~15주차)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0A0D1C; --bg-1:#111633; --card:#151B3B; --card-border:#2A3266;
    --text-0:#F1F3FC; --text-1:#A8AEDB; --text-2:#6C72A0;
    --holo-a:#5EE7C7; --holo-b:#B48CFF; --holo-c:#FFC96B;
    --ok:#5EE7C7; --err:#FF8A8A; --pending:#5C6294;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, #1B2354 0%, transparent 45%),
      radial-gradient(circle at 90% 10%, #241C4A 0%, transparent 40%),
      var(--bg-0);
    color:var(--text-0); font-family:'Inter',sans-serif;
    padding:48px 20px 80px;
  }
  .wrap{max-width:560px;margin:0 auto;}
  .top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--holo-a);font-weight:600;}
  .lang-switch{display:flex;gap:4px;background:var(--bg-1);border:1px solid var(--card-border);border-radius:999px;padding:3px;flex-shrink:0;}
  .lang-btn{
    background:none;border:none;color:var(--text-2);font-size:12px;font-weight:600;padding:5px 12px;
    border-radius:999px;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:background .15s,color .15s;
  }
  .lang-btn.active{background:linear-gradient(90deg,var(--holo-a),var(--holo-b));color:#0A0D1C;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(22px,4vw,30px);font-weight:700;margin:0 0 8px;line-height:1.3;}
  .tagline{font-size:14px;font-weight:600;color:var(--holo-b);margin:0 0 14px;}
  .sub{color:var(--text-1);font-size:14px;line-height:1.6;margin:0 0 28px;}

  form{
    position:relative;background:var(--card);border:1px solid var(--card-border);
    border-radius:16px;padding:28px 24px;overflow:hidden;isolation:isolate;
  }
  form::before{
    content:"";position:absolute;inset:0;
    background:conic-gradient(from 180deg at 100% 0%, var(--holo-a), var(--holo-b), var(--holo-c), var(--holo-a));
    opacity:.08;z-index:-1;
  }
  label{display:block;font-size:13px;font-weight:500;color:var(--text-1);margin:0 0 6px;}
  .hint-label{font-size:12px;color:var(--text-2);font-weight:400;margin-left:6px;}
  .field{margin-bottom:18px;}
  .field-row{display:flex;gap:12px;}
  .field-row .field{flex:1;}
  select, input[type="text"], input[type="url"], input[type="password"], textarea{
    width:100%;background:rgba(255,255,255,.03);border:1px solid var(--card-border);
    color:var(--text-0);font-size:14px;padding:11px 12px;border-radius:8px;
    font-family:inherit;outline:none;transition:border-color .15s;
  }
  textarea{resize:vertical;min-height:70px;line-height:1.5;}
  select:focus, input:focus, textarea:focus{border-color:var(--holo-a);}
  select option{background:#151B3B;color:#F1F3FC;}
  select option:disabled{color:#6C72A0;}

  .file-drop{
    border:1px dashed var(--card-border);border-radius:8px;padding:20px 14px;
    text-align:center;cursor:pointer;transition:border-color .15s,background .15s;
    background:rgba(255,255,255,.02);
  }
  .file-drop:hover, .file-drop.drag{border-color:var(--holo-a);background:rgba(94,231,199,.05);}
  .file-drop input{display:none;}
  .file-drop .hint{font-size:12px;color:var(--text-2);margin-top:4px;}
  .file-list{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
  .file-chip{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:rgba(94,231,199,.08);border:1px solid rgba(94,231,199,.25);
    color:var(--holo-a);font-size:12px;padding:7px 10px;border-radius:6px;
  }
  .file-chip .fname{word-break:break-all;text-align:left;}
  .file-chip .fsize{color:var(--text-2);flex-shrink:0;}
  .file-chip button{
    background:none;border:none;color:var(--err);cursor:pointer;font-size:14px;
    flex-shrink:0;line-height:1;padding:2px 4px;
  }
  .clear-files{font-size:12px;color:var(--text-2);cursor:pointer;text-decoration:underline;text-underline-offset:2px;margin-top:8px;display:inline-block;}

  button[type="submit"], button.secondary-btn{
    width:100%;border:none;font-weight:700;font-size:14px;padding:13px;
    border-radius:8px;cursor:pointer;font-family:'Space Grotesk',sans-serif;
    margin-top:6px;transition:opacity .15s;
  }
  button[type="submit"]{background:linear-gradient(90deg,var(--holo-a),var(--holo-b));color:#0A0D1C;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  button.secondary-btn{background:transparent;border:1px solid var(--card-border);color:var(--text-0);font-weight:500;}
  #submit-status{margin-top:16px;font-size:13px;line-height:1.6;padding:10px 12px;border-radius:8px;display:none;}
  #submit-status.show{display:block;}
  #submit-status.ok{background:rgba(94,231,199,.1);color:var(--ok);border:1px solid rgba(94,231,199,.3);}
  #submit-status.err{background:rgba(255,138,138,.1);color:var(--err);border:1px solid rgba(255,138,138,.3);}
  #submit-status.loading{background:rgba(168,174,219,.1);color:var(--text-1);border:1px solid var(--card-border);}
  .pw-toggle{font-size:12px;color:var(--holo-a);margin-top:8px;cursor:pointer;text-decoration:underline;text-underline-offset:2px;}
  .pw-change{border:1px solid var(--card-border);border-radius:10px;padding:16px 14px 4px;margin-bottom:18px;background:rgba(255,255,255,.02);}
  .status-link{
    display:inline-flex;align-items:center;gap:6px;margin-top:20px;font-size:13px;
    color:var(--text-1);text-decoration:none;border:1px solid var(--card-border);
    padding:9px 14px;border-radius:999px;
  }
  .status-link:hover{border-color:var(--holo-a);color:var(--text-0);}
  footer{margin-top:32px;font-size:12px;color:var(--text-2);line-height:1.7;}
</style>
</head>

  <p class="sub" id="t-sub"></p>

        <label id="t-studentIdLabel" for="studentSelect">학번</label>

      <div class="field">
        <label id="t-weekLabel" for="week">주차</label>
        <select id="week" required></select>
      </div>
    </div>

    <div class="field">
      <label id="t-nameLabel">이름</label>
      <input type="text" id="nameDisplay" readonly>
    </div>

    <div class="field">
      <label id="t-passwordLabel" for="password">비밀번호</label>
      <input type="password" id="password" required autocomplete="off">
      <div class="pw-toggle" id="pw-toggle"></div>
    </div>

    <div class="pw-change" id="pw-change" style="display:none;">
      <div class="field">
        <label id="t-newPasswordLabel" for="new-password">새 비밀번호</label>
        <input type="password" id="new-password" autocomplete="off">
      </div>
      <div class="field">
        <label id="t-newPasswordConfirmLabel" for="new-password-confirm">새 비밀번호 확인</label>
        <input type="password" id="new-password-confirm" autocomplete="off">
      </div>
      <button type="button" id="pw-change-btn" class="secondary-btn"></button>
    </div>

    <div class="field">
      <label id="t-filesLabel">제출 파일 <span class="hint-label" id="t-filesHint">(여러 개 가능)</span></label>
      <div class="file-drop" id="drop-zone">
        <div id="t-dropText">클릭하거나 파일을 끌어다 놓으세요</div>
        <div class="hint" id="t-dropHint">여러 파일을 한 번에 또는 나눠서 추가할 수 있습니다</div>
        <input type="file" id="file-input" multiple>
      </div>
      <div class="file-list" id="file-list"></div>
      <span class="clear-files" id="clear-files" style="display:none;"></span>
    </div>

    <div class="field">
      <label id="t-linkLabel" for="link">제출 링크 <span class="hint-label" id="t-linkHint">(선택, 주차당 1개)</span></label>
      <input type="url" id="link">
    </div>

    <button type="submit" id="submit-btn"></button>
    <div id="submit-status"></div>
  </form>

  <a class="status-link" href="2_1_nlp_submission_status.html" target="_blank" rel="noopener" id="t-statusLink">📊 제출 현황 확인하기</a>

  <footer id="t-footer"></footer>
</div>

  document.getElementById('link').placeholder = t('linkPlaceholder');
  document.getElementById('submit-btn').textContent = t('submitBtn');
  document.getElementById('t-statusLink').textContent = t('statusLink');
  document.getElementById('t-footer').textContent = t('footer');

  const pwChangeOpen = document.getElementById('pw-change').style.display !== 'none';
  document.getElementById('pw-toggle').textContent = pwChangeOpen ? t('pwToggleHide') : t('pwToggleShow');

  renderStudentOptions();
  renderWeekOptions();
  renderFileList();
}

document.getElementById('lang-ko').addEventListener('click', () => setLang('ko'));
document.getElementById('lang-en').addEventListener('click', () => setLang('en'));
function setLang(lang){
  LANG = lang;
  document.getElementById('lang-ko').classList.toggle('active', lang === 'ko');
  document.getElementById('lang-en').classList.toggle('active', lang === 'en');
  applyLanguage();
}

const studentSelect = document.getElementById('studentSelect');
const studentsById = [...STUDENTS].sort((a, b) => a.id.localeCompare(b.id));
let selectedStudentName = '';
const nameDisplay = document.getElementById('nameDisplay');

function renderStudentOptions(){
  const prevValue = studentSelect.value;
  studentSelect.innerHTML = '<option value="" disabled' + (prevValue ? '' : ' selected') + '>' + t('studentIdPlaceholder') + '</option>' +
    studentsById.map(s => `<option value="${s.id}" data-name="${s.name}">${s.id} (${s.name})</option>`).join('');
  if (prevValue) studentSelect.value = prevValue;
}

studentSelect.addEventListener('change', () => {
  const opt = studentSelect.selectedOptions[0];
  selectedStudentName = opt ? opt.dataset.name : '';
  nameDisplay.value = selectedStudentName;
});

const weekSelect = document.getElementById('week');
function renderWeekOptions(){
  const prevValue = weekSelect.value;
  weekSelect.innerHTML = '<option value="" disabled' + (prevValue ? '' : ' selected') + '>' + t('weekPlaceholder') + '</option>' +
    Array.from({length: TOTAL_WEEKS}, (_, i) => i + 1)
      .map(n => `<option value="${n}">${t('weekOpt')(n)}</option>`).join('');
  if (prevValue) weekSelect.value = prevValue;
}

// ══════════ 파일 선택 로직 (다중 파일 누적) ══════════
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const fileListEl = document.getElementById('file-list');
const clearFilesEl = document.getElementById('clear-files');
let selectedFiles = [];

function formatSize(bytes){
  if (bytes < 1024) return bytes + 'B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + 'KB';
  return (bytes/1024/1024).toFixed(1) + 'MB';
}

function renderFileList(){
  fileListEl.innerHTML = '';
  selectedFiles.forEach((f, idx) => {
    const chip = document.createElement('div');
    chip.className = 'file-chip';
    chip.innerHTML = `<span class="fname">${f.name}</span><span class="fsize">${formatSize(f.size)}</span><button type="button" aria-label="${t('removeAria')}">✕</button>`;
    chip.querySelector('button').addEventListener('click', () => {
      selectedFiles.splice(idx, 1);
      renderFileList();
    });
    fileListEl.appendChild(chip);
  });
  clearFilesEl.style.display = selectedFiles.length ? 'inline-block' : 'none';
}

function addFiles(fileArr){
  Array.from(fileArr).forEach(f => selectedFiles.push(f));
  renderFileList();
}

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag');
  if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) addFiles(fileInput.files);
  fileInput.value = '';
});
clearFilesEl.addEventListener('click', () => { selectedFiles = []; renderFileList(); });

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function setSubmitStatus(text, type){
  const el = document.getElementById('submit-status');
  el.textContent = text;
  el.className = 'show ' + type;
}

function isValidUrl(str){
  try {
    const u = new URL(str);
    return u.protocol === 'http:' || u.protocol === 'https:';
  } catch (e) {
    return false;
  }
}

async function fetchWithRetry(url, options, retries){
  retries = retries === undefined ? 1 : retries;
  try {
    return await fetch(url, options);
  } catch (err) {
    if (retries > 0) {
      await new Promise(r => setTimeout(r, 1200));
      return fetchWithRetry(url, options, retries - 1);
    }
    throw err;
  }
}

// ══════════ 비밀번호 변경 토글 ══════════
const pwToggle = document.getElementById('pw-toggle');
const pwChange = document.getElementById('pw-change');
pwToggle.addEventListener('click', () => {
  const showing = pwChange.style.display !== 'none';
  pwChange.style.display = showing ? 'none' : 'block';
  pwToggle.textContent = showing ? t('pwToggleShow') : t('pwToggleHide');
});

document.getElementById('pw-change-btn').addEventListener('click', async () => {
  const studentId = studentSelect.value;
  const password = document.getElementById('password').value;
  const newPassword = document.getElementById('new-password').value;
  const newPasswordConfirm = document.getElementById('new-password-confirm').value;

  if (!studentId) { setSubmitStatus(t('msgEnterIdFirst'), 'err'); return; }
  if (!password) { setSubmitStatus(t('msgEnterCurrentPw'), 'err'); return; }
  if (!newPassword) { setSubmitStatus(t('msgEnterNewPw'), 'err'); return; }
  if (newPassword !== newPasswordConfirm) { setSubmitStatus(t('msgPwMismatch'), 'err'); return; }
  if (WEB_APP_URL.indexOf('http') !== 0) { setSubmitStatus(t('msgUrlNotSet2'), 'err'); return; }

  setSubmitStatus(t('msgChangingPw'), 'loading');
  try {
    const res = await fetchWithRetry(WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'changePassword', studentId, password, newPassword, lang: LANG })
    });
    const result = await res.json();
    if (result.ok) {
      setSubmitStatus(t('msgPwChanged'), 'ok');
      document.getElementById('password').value = newPassword;
      document.getElementById('new-password').value = '';
      document.getElementById('new-password-confirm').value = '';
      pwChange.style.display = 'none';
      pwToggle.textContent = t('pwToggleShow');
    } else {
      setSubmitStatus(t('msgPwChangeFail')(result.error || t('unknownError')), 'err');
    }
  } catch (err) {
    setSubmitStatus(t('msgPwChangeError')(err.message), 'err');
  }
});

// ══════════ 제출 로직 ══════════
document.getElementById('submit-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const studentId = studentSelect.value;
  const name = selectedStudentName;
  const week = document.getElementById('week').value;
  const password = document.getElementById('password').value;
  const link = document.getElementById('link').value.trim();
  const btn = document.getElementById('submit-btn');

  if (!studentId) { setSubmitStatus(t('msgEnterId'), 'err'); return; }
  if (!week) { setSubmitStatus(t('msgSelectWeek'), 'err'); return; }
  if (!password) { setSubmitStatus(t('msgEnterPassword'), 'err'); return; }
  if (!selectedFiles.length && !link) {
    setSubmitStatus(t('msgNeedFileOrLink'), 'err'); return;
  }
  if (link && !isValidUrl(link)) {
    setSubmitStatus(t('msgInvalidLink'), 'err'); return;
  }
  if (WEB_APP_URL.indexOf('http') !== 0) {
    setSubmitStatus(t('msgUrlNotSet'), 'err'); return;
  }

  btn.disabled = true;
  setSubmitStatus(t('msgSubmitting'), 'loading');

  try {
    const files = await Promise.all(selectedFiles.map(async f => ({
      fileBase64: await fileToBase64(f),
      fileName: f.name,
      mimeType: f.type || 'application/octet-stream'
    })));

    const payload = { action: 'submit', studentId, name, week, password, files, link, lang: LANG };

    const res = await fetchWithRetry(WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const result = await res.json();

    if (result.ok) {
      setSubmitStatus(t('msgSubmitOk')(name, studentId, week), 'ok');
      selectedFiles = []; renderFileList();
      document.getElementById('link').value = '';
    } else {
      setSubmitStatus(t('msgSubmitFail')(result.error || t('unknownError')), 'err');
    }
  } catch (err) {
    setSubmitStatus(t('msgSubmitError')(err.message), 'err');
  } finally {
    btn.disabled = false;
  }
});

// ══════════ 초기화 ══════════
applyLanguage();
</script>
